<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{page_title}}</title>
  <meta name="description" content="{{site_description}}">
  <link rel="stylesheet" href="{{base}}/assets/style.css">
  <link rel="alternate" type="application/rss+xml" title="{{site_title}}" href="{{base}}/rss.xml">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="{{base}}/index.html">{{site_title}}</a>
      <nav class="nav">{{nav}}</nav>
      <button id="theme-toggle" class="theme-toggle" aria-label="切换主题">🌓</button>
    </div>
  </header>
  <main class="container">
    {{content}}
  </main>
  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year">{{year}}</span> {{author}} · 由 WorkBuddy 静态生成</p>
    </div>
  </footer>
  <script src="{{base}}/assets/main.js"></script>
</body>
</html>
