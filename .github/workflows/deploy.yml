name: Build & Publish Blog

# Rebuild the static site whenever content is pushed to main
# (including edits made directly on GitHub.com), then commit the
# generated HTML back so GitHub Pages (serving the repo root) updates.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to commit generated files back to main

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Remove local deploy helper (not for publication)
        run: rm -f _deploy.cjs

      - name: Build static site
        run: node build.js

      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "chore: rebuild site [skip ci]"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push
